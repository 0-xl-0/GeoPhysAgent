name: Paid MiniMax acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimax:
    runs-on: windows-latest
    environment: paid-online-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package
        run: python -m pip install --no-deps .
      - name: Run explicit paid acceptance
        shell: pwsh
        env:
          GEOPHYSAGENT_RUN_MINIMAX_TESTS: "1"
          MINIMAX_CN_API_KEY: ${{ secrets.MINIMAX_CN_API_KEY }}
          GEOPHYSAGENT_ONLINE_CONFIG: geophysagent.example.toml
          GEOPHYSAGENT_ONLINE_PROFILE: minimax-direct-m2_7
        run: python -m unittest tests.test_online_minimax -v
